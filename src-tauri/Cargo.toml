[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", features = ["png"] }
rapidocr-core = "0.2.2"
xcap = "0.9.8"
base64 = "0.22"
# Windows 系统 OCR(Windows.Media.Ocr)PoC:验证 unpackaged 应用能否调用
windows = { version = "0.62", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Win32_System_Com",
    # 音频:WASAPI loopback 捕获系统内部播放音频(第7波)
    "Win32_Media_Audio",
    "Win32_Foundation",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # 拖动语音窗:SetCapture/GetCursorPos/SetWindowPos/GetAsyncKeyState
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
] }
# 第7波:流式语音识别 ASR(sherpa-onnx 官方预编译库自动下载,静态链接)
sherpa-onnx = "1.13.5"

