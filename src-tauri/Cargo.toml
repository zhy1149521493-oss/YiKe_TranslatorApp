[package]
name = "tauri-app"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "tauri_app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-global-shortcut = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
image = { version = "0.25.10", features = ["png"] }
rapidocr-core = "0.2.2"
xcap = "0.9.8"
base64 = "0.22"
# Windows 系统 OCR(Windows.Media.Ocr)PoC:验证 unpackaged 应用能否调用
windows = { version = "0.62", features = [
    "Media_Ocr",
    "Graphics_Imaging",
    "Storage_Streams",
    "Foundation",
    "Win32_System_Com",
    # 音频:WASAPI loopback 捕获系统内部播放音频(第7波)
    "Win32_Media_Audio",
    "Win32_Foundation",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    # 拖动语音窗:SetCapture/GetCursorPos/SetWindowPos/GetAsyncKeyState
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    # 单实例:CreateMutexW / CreateEventW / WaitForSingleObject
    "Win32_System_Threading",
    "Win32_Security",
    # Wave 10 退出清理:Job Object 托管 Ollama 进程树(KILL_ON_JOB_CLOSE)
    "Win32_System_JobObjects",
    # Wave 10 启动自愈:枚举进程 + 取 exe 路径,识别并清理本目录残留 ollama
    "Win32_System_Diagnostics_ToolHelp",
] }
# 第7波:流式语音识别 ASR(sherpa-onnx 官方预编译库自动下载,静态链接)
sherpa-onnx = "1.13.5"
# 第8波:外接 API 走 Rust 代理(reqwest)——中转站/中继服务普遍不做浏览器 CORS,
# 前端 fetch 会被拦;Rust 侧无 CORS 限制,同时统一处理超时
reqwest = { version = "0.12", features = ["json", "stream"] }
futures-util = "0.3"
# 第 10.5 波:GGUF 本地模型导入(流式计算 sha256;已在依赖树中,无需新下载)
sha2 = "0.10"
